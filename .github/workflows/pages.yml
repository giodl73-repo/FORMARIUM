name: Deploy Formarium website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install --yes pandoc

      - name: Verify Formarium contracts
        run: node tools/build_formarium_contracts.js --check

      - name: Render website
        shell: pwsh
        run: ./tools/render_proof_set.ps1 -Edition sim-66

      - name: Verify website
        run: node tools/check_formarium_canonical.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/proof-set-sim-66

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
