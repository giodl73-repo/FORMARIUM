name: Deploy Formarium website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pandoc
        env:
          GH_TOKEN: ${{ github.token }}
          PANDOC_VERSION: "3.9"
          PANDOC_SHA256: "872a10c7ec29d5278831d855b11bd4ade0df4d5ec9a089a3197bc63a37eb4003"
        run: |
          archive="pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          install_dir="${RUNNER_TEMP}/pandoc"
          gh release download "${PANDOC_VERSION}" \
            --repo jgm/pandoc \
            --pattern "${archive}" \
            --dir "${RUNNER_TEMP}"
          echo "${PANDOC_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          mkdir -p "${install_dir}"
          tar --extract --gzip \
            --file "${RUNNER_TEMP}/${archive}" \
            --directory "${install_dir}" \
            --strip-components=1
          echo "${install_dir}/bin" >> "${GITHUB_PATH}"

      - name: Verify Formarium contracts
        run: node tools/build_formarium_contracts.js --check

      - name: Render website
        shell: pwsh
        run: ./tools/render_proof_set.ps1 -Edition sim-66

      - name: Verify website
        run: node tools/check_formarium_canonical.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/proof-set-sim-66

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
